esphome:
  name: lsm6ds_test

esp32:
  board: esp32dev
  framework:
    type: arduino

i2c:
  sda: 21
  scl: 22

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

lsm6ds_i2c:
  id: my_lsm6ds_i2c
  address: 0x6A

lsm6ds_spi:
  id: my_lsm6ds_spi
  cs_pin: 5

sensor:
  - platform: lsm6ds
    lsm6ds_id: my_lsm6ds_i2c
    accel_x:
      name: "I2C Accel X"
    gyro_x:
      name: "I2C Gyro X"
    temperature:
      name: "I2C Temp"

  - platform: lsm6ds
    lsm6ds_id: my_lsm6ds_spi
    accel_x:
      name: "SPI Accel X"
    gyro_x:
      name: "SPI Gyro X"
    temperature:
      name: "SPI Temp"
