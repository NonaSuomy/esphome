sensor:
  - platform: usb_hidx
    name: "Mouse X Movement"
    type: mouse
    x_delta: true
  - platform: usb_hidx
    name: "Mouse Y Movement"
    type: mouse
    y_delta: true
  - platform: usb_hidx
    name: "Mouse Wheel"
    type: mouse
    wheel: true

