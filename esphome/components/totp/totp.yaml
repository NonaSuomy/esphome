substitutions:
  totp_secret: !secret totp_secret012

esp32:
  board: esp32-s3-devkitc-1
  framework:
    #type: arduino
    type: esp-idf

esphome:
  name: totp
  friendly_name: totp
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi
    
external_components:
  - source:
      type: git
      url: https://github.com/NonaSuomy/esphome
      ref: totp
    components: [totp]

psram:
  mode: octal
  speed: 80MHz

debug:
  update_interval: 5s

logger:
  level: DEBUG

api:
  encryption:
    key: !secret encryption_key012

  services:
    - service: play_rtttl
      variables:
        song: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song;'
ota:
  - platform: esphome
    password: !secret ota_pass012

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password2
  use_address: !secret use_address_wifi2_012

  ap:
    ssid: "EZHackLock Fallback Hotspot"
    password: !secret fallbackhotspot012

captive_portal:

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time
    servers:
    - 0.pool.ntp.org
    - 1.pool.ntp.org
    - 2.pool.ntp.org
    timezone: America/Toronto

totp:
  secret: ${totp_secret}
  time_id: sntp_time
  id: my_totp
  totp:
    name: TOTP
  countdown:
    name: Countdown

matrix_keypad:
  - id: keypad001
    columns:
      - pin: GPIO16
      - pin: GPIO12
      - pin: GPIO11
    rows:
      - pin: GPIO18
      - pin: GPIO09
      - pin: GPIO17
      - pin: GPIO10
    keys: 123456789*E0

key_collector:
  - id: pincode_reader
    min_length: 6
    max_length: 6
    end_keys: "E"
    end_key_required: true
    allowed_keys: "0123456789"
    timeout: 30s
    on_progress:
      #- logger.log:
      #    format: "Input progress: '%s', length: %d"
      #    args: ['x.c_str()', 'x.length()']
      - lambda: |-
          id(entered_code) = x;
    on_result:
      #- logger.log:
      #    format: "Input result: '%s', length: %d"
      #    args: ['x.c_str()', 'x.length()']
      - lambda: |-
          id(entered_code) = "\"\"";  // Reset the entered code after processing
      - script.execute:
          id: check_totp_code
          code: !lambda "return x;"
    on_timeout:
      #- logger.log:
      #    format: "Input timeout after: '%s', length: %d"
      #    args: ['x.c_str()', 'x.length()']
      - lambda: |-
          id(entered_code) = "\"\"";  // Reset entered code on timeout

  # Matrix Keypad Keys
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 0
    col: 0
    name: "Key 1"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "1"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 0
    col: 1
    name: "Key 2"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "2"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 0
    col: 2
    name: "Key 3"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "3"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 1
    col: 0
    name: "Key 4"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "4"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 1
    col: 1
    name: "Key 5"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "5"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 1
    col: 2
    name: "Key 6"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "6"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 2
    col: 0
    name: "Key 7"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "7"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 2
    col: 1
    name: "Key 8"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "8"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 2
    col: 2
    name: "Key 9"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "9"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 3
    col: 0
    name: "Key 0"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "0"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 3
    col: 1
    name: "Key E (EZSet)"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "E"
  - platform: matrix_keypad
    keypad_id: keypad001
    row: 3
    col: 2
    name: "Key * (Dummy)"
    on_press:
      then:
        - script.execute:
            id: handle_keypad_press
            key: "*"
script:
  - id: handle_keypad_press
    parameters:
      key: string
    then:
      - logger.log: "Keypad touched!"
      # Show current lock state and start fade timer
      - if:
          condition:
            #binary_sensor.is_on: limitswitch1  # Locked state
          then:
            - logger.log: "Red!"
          else:
            - logger.log: "Green!"
      # Handle keypad input
      - lambda: |-
          if (!key.empty()) {
            char pressed_key = key[0];
            if (pressed_key >= '0' && pressed_key <= '9') {
              id(entered_code) = id(entered_code) + pressed_key;
              id(pincode_reader).send_key(pressed_key);
            } else if (pressed_key == 'E') {
              if (id(entered_code) == "\"\"" || id(entered_code).length() == 0) {
                id(failure_indicator).execute();
              } else {
                id(pincode_reader).send_key('E');
                id(entered_code) = "\"\"";
              }
            }
          }
  - id: success_indicator
    then:
      - delay: 100ms
        - logger.log: "Success!"
      - repeat:
          count: 3
          then:
            - logger.log: "Blink Green!"

  - id: failure_indicator
    then:
      - logger.log: "Failure!"
      - delay: 100ms
      - repeat:
          count: 3
          then:
            - logger.log: "Blink Red!"

  - id: error_indicator
    then:
      - logger.log: "Erorr!"
      - delay: 100ms
      - repeat:
          count: 3
          then:
            - logger.log: "Blink Orange!"

  - id: check_totp_code
    parameters:
      code: string
    then:
      - lambda: |-
          id(entered_code) = "\"\"";  // Reset entered code after processing
          auto current_totp = id(my_totp).get_current_totp();
          if (code == current_totp) {
            // Code is correct
            - logger.log: "Code Correct!"
          } else {
            - logger.log: "Code Incorrect!"
          }
