esphome:
  name: esp32-usb-hid
  friendly_name: ESP32 USB HID Monitor

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_USB_HOST_ENABLE: y
      CONFIG_USB_HOST_HCD_DWC_NUM_CHANNELS: "8"
      CONFIG_ESP32S3_BROWNOUT_DET: "n"

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# USB Host configuration
usb_host:
  enable_hubs: true

# USB HIDX Component
usb_hidx:
  hub: true

# Keyboard support
text_sensor:
  - platform: usb_hidx
    keyboard:
      device_id: keyboard_main
      layout: US
      name: "Keyboard Input"

# Mouse support
binary_sensor:
  - platform: usb_hidx
    mouse:
      device_id: mouse_main
      left_button:
        name: "Mouse Left Button"
      right_button:
        name: "Mouse Right Button"

sensor:
  - platform: usb_hidx
    mouse:
      device_id: mouse_main
      x_delta:
        name: "Mouse X Movement"
      y_delta:
        name: "Mouse Y Movement"

# Gamepad support
binary_sensor:
  - platform: usb_hidx
    gamepad:
      device_id: gamepad_main
      type: generic
      button_a:
        name: "Gamepad A"
      button_b:
        name: "Gamepad B"
