# TTGO-Camera Plus 001 https://www.lilygo.cc/en-ca/products/t-camera-plus

substitutions:
  device_friendly_name: ttgo-camera-plus-cam-to-dis
  device_name: ttgo-camera-plus-cam-to-dis
  created_by: "TTGO 20190214"
  device_description: "TTGO-Camera-Plus Module with ST7789 Display IPS Panel 1.3 Inch 260ppi 240x240 16-bit full color pixels, OV2640 V2.1 2Megapixel, MSM261S4030H0 I2S Mic, MPU6050 Accelerometer/Gyroscope Sensor, SDCard Slot & IP5306 Battery Management"
  
  # Pin define
 
  # SDCard
  sd_cs: GPIO0 # Chip Select

  # SPI
  spi_clk: GPIO21  # Serial Clock
  spi_mosi: GPIO19 # Main Out Sub In
  spi_miso: GPIO22 # Main In Sub Out
  
  # Display
  #1: BLK = Backlight
  #2: D/C = Data/Command
  #3: RES = Reset
  #4: SDA = Serial Data or SPI MOSI
  #5: SCL = Serial Clock or SPI SCK
  #   (These pins being active conflict with the other I2C devices on the same lines)
  #6: VCC (3.3V)
  #7: Ground
  dis_cs: GPIO12 # Chip Select
  dis_dc: GPIO15 # Data/Command
  dis_bk: GPIO2  # Backlight

  # Camera
  cam_d0: GPIO34   # Camera Data pin 0
  cam_d1: GPIO13   # Camera Data pin 1
  cam_d2: GPIO26   # Camera Data pin 2
  cam_d3: GPIO35   # Camera Data pin 3
  cam_d4: GPIO39   # Camera Data pin 4
  cam_d5: GPIO38   # Camera Data pin 5
  cam_d6: GPIO37   # Camera Data pin 6
  cam_d7: GPIO36   # Camera Data pin 7
  cam_vsync: GPIO5 # Camera VSYNC
  cam_href: GPIO27 # Camera HREF
  cam_pclk: GPIO25 # Camera Pixel Clock
  cam_xclk: GPIO4  # Camera External Clock
  cam_sda: GPIO18  # Camera SDA
  cam_scl: GPIO23  # Camera SCL

  # I2C Bus: 0x30 Camera OV2640 2MP, 0x75 IP5306 Battery Management, 0x68 MPU6050 Accelerometer/Gyroscope Sensor
  i2c_sda: GPIO18 # I2C Serial Data
  i2c_scl: GPIO23 # I2C Serial Clock

esphome:
  name: $device_name
  friendly_name: ${device_friendly_name}
  comment: "${device_friendly_name}"
  project:
    name: nonasuomy.ttgo-camera-plus
    version: "1.0"
  platformio_options:
    # Run flash in 2 pin mode instead of 4 pin because:
    #   Pin 12 is used for display CS
    #   Pin 13 is used for camera data 1
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  variant: esp32
  #stack_size: 16384
  framework:
    #type: arduino
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source: 
      type: local
      path: components
    components:
      - camera_to_display
      - esp32_camera

# Enable logging
logger:
  level: DEBUG  # or VERBOSE for even more detail
  logs:
    camera_to_display: DEBUG  # or VERBOSE
  #baud_rate: 0
  #level: VERY_VERBOSE
  #level: VERBOSE
  #level: INFO
  #level: NONE
  # logs: 
  #   switch: debug
  #   wifi: debug

wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password2
  use_address: !secret use_address_wifi2_007
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "TTGO-Camera-Plus-001"
    password: !secret fallbackhotspot007

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key007

# Over The Air updates
ota:
  - platform: esphome
    password: !secret ota_pass007

captive_portal:

web_server:

# TTGO Camera Plus
# OV2640 2Megapixel
esp32_camera:
  name: TTGOCameraPlus001
  id: ov2640camera
  external_clock:
    pin: $cam_xclk
    frequency: 20MHz
  i2c_pins:
    sda: 
      number: $cam_sda
      allow_other_uses: true
    scl: 
      number: $cam_scl
      allow_other_uses: true
  data_pins: [$cam_d0, $cam_d1, $cam_d2, $cam_d3, $cam_d4, $cam_d5, $cam_d6, $cam_d7]
  vsync_pin: $cam_vsync
  href_pin: $cam_href
  pixel_clock_pin: $cam_pclk
  vertical_flip: false
  horizontal_mirror: false

  icon: mdi:camera
  idle_framerate: 1fps
  max_framerate: 10fps
  frame_buffer_count: 2
  resolution: 320x240
  jpeg_quality: 10

  test_pattern: false 

  #contrast: 1
  #brightness: 1
  #saturation: 1

# Camera Web Server
#esp32_camera_web_server:
#  - port: 8080
#    mode: stream
#  - port: 8081
#    mode: snapshot

switch:
  #- platform: gpio
  #  pin: GPIO2
  #  name: "Display Backlight"
  #  id: backlight 
  #  disabled_by_default: True
  #  restore_mode: RESTORE_DEFAULT_ON  
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Restart (Safe Mode)"

# I2C Bus Addresses
# 0x30 Camera OV2640 2Megapixel
# 0x68 MPU6050 Accelerometer/Gyroscope Sensor
# 0x75 IP5306 Battery Management
i2c:
  - id: bus_a
    sda: 
      number: $i2c_sda
      allow_other_uses: true
    scl: 
      number: $i2c_scl
      allow_other_uses: true
    scan: true

# ST7789 Display
# IPS Panel 1.3 Inch 260ppi 240x240 16-bit full color pixels 
spi:
  clk_pin: $spi_clk
  mosi_pin: $spi_mosi
  #miso_pin: $spi_miso 
# Comment out the miso pin for the display as it only works in half duplex mode for framework: idf (works fine with framework: arduino)
# [D][esp-idf:000]: E (1733) spi_hal: spi_hal_cal_clock_conf(100): When work in full-duplex mode at frequency > 26.7MHz, device cannot read correct data.
# Try to use IOMUX pins to increase the frequency limit, or use the half duplex mode.
# Please note the SPI master canE (1783) spi_master: spi_bus_add_device(415): assigned clock speed not supported
# [03:47:07] only work at divisors of 80MHz, and the driver always tries to find the closest frequency to your configuration.
# Specify ``SPI_DEVICE_NO_DUMMY`` to ignore this checking. Then you can output data at higher speed, or read data at yo
# 0;31mE (1812) spi_master: check_trans_valid(763): invalid dev handle
# [03:47:08]31m[E][spi-esp-idf:030]: Add device failed - err 106
# [W][spi-esp-idf:041]: spi_setup called before initialisation
# [E][spi-esp-idf:081]: Transmit failed - err 102

# Define a PWM output on the ESP32 for the display backlight
output:
  - platform: ledc
    pin: $dis_bk
    id: gpio_dis_bk_backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: gpio_dis_bk_backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_arial
    size: 20

color:
  - id: my_red
    red: 100%
    green: 3%
    blue: 5%

display:
  - platform: ili9xxx
    model: st7789v
    id: st7789_display
    dimensions:
      height: 240
      width: 240
      offset_width: 0
      offset_height: 0
    invert_colors: true 
    cs_pin: $dis_cs
    dc_pin: $dis_dc
    #spi_mode: 3
    data_rate: 80MHz
    # Test Display - Draw a red square around the LCD
    #lambda: |-
    #  it.rectangle(0,  0, it.get_width(), it.get_height(), id(my_red));

camera_to_display:
  id: camera_display
  camera: ov2640camera
  display: st7789_display
  update_interval: 200ms
  
